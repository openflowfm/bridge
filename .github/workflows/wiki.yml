name: wiki

# docs/ is the source of truth; the wiki is generated output. Editing a page on
# github.com is overwritten by the next run — the footer on every page says so.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/wiki-sync.ts'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # No npm install: wiki-sync.ts has no dependencies beyond node: builtins,
      # and Node 24 runs it straight from source.
      - name: Render the pages
        run: node --disable-warning=ExperimentalWarning tools/wiki-sync.ts "$RUNNER_TEMP/pages"

      # The wiki lives in its own repository. It does not exist until the first
      # page has been created through the web UI — a fresh one 404s here.
      - name: Check out the wiki
        run: |
          set -eu
          if ! git clone \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null
          then
            echo "::error::Could not clone the wiki. If this repo's wiki has never had a page created, open the Wiki tab and save one — the wiki repository doesn't exist until then."
            exit 1
          fi

      - name: Publish
        run: |
          set -eux
          rm -f wiki/*.md
          cp "$RUNNER_TEMP/pages"/*.md wiki/
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches docs/"
            exit 0
          fi
          git commit -m "Sync from docs/ @ ${GITHUB_SHA::7}"
          git push
