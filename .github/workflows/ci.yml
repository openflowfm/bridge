name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The probe's analysis (probe/test). The only automated tests in this repo.
      - run: npm test

      # The "must build from a clean tree" rule, enforced rather than
      # remembered. A clean checkout is the only place it's honestly tested —
      # a file that's untracked but imported passes locally and fails here.
      - run: npm run build

      # lom.ts has no automated coverage: it needs Live open with the device
      # loaded. Attaching the build to every run is the compensating control —
      # a change can be tried in Live without building the branch by hand.
      - uses: actions/upload-artifact@v7
        with:
          name: SessionBridge-${{ github.sha }}
          path: |
            SessionBridge.amxd
            bridge.js
            lom.js
          if-no-files-found: error
          retention-days: 14
