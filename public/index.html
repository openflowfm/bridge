<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Bridge</title>
<style>
  :root {
    --bg:#0a0a0b; --panel:#111113; --rail:#0e0e10; --row:#141416; --sel:#1c1c20;
    --bd:#262629; --bd2:#232327; --bd3:#2c2c31;
    --fg:#ececed; --fg2:#b7b7be; --dim:#8b8b93; --dim2:#5e5e66;
    --amber:#f0b23c; --red:#d4544f; --green:#5fbfa8;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:center; gap:14px; padding:0 16px; height:48px;
           background:#151517; border-bottom:1px solid var(--bd); flex:none; }
  .title { font-size:13px; font-weight:600; letter-spacing:-.01em; }
  .pill { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
          padding:3px 8px; border-radius:3px; border:1px solid var(--bd3); color:var(--dim); }
  .pill.on { color:var(--green); border-color:rgba(95,191,168,.4); }
  .pill.off { color:var(--red); border-color:rgba(212,84,79,.4); }
  .spacer { flex:1; }
  button { font-family:var(--sans); font-size:12px; padding:6px 12px; border-radius:4px;
           border:1px solid var(--bd3); background:transparent; color:var(--fg2); cursor:pointer; }
  button:hover:not(:disabled) { border-color:#4a4a52; color:var(--fg); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--amber); color:#0a0a0b; font-weight:600; border-color:var(--amber); }
  button.primary:hover:not(:disabled) { background:#ffc961; }

  main { flex:1; display:flex; min-height:0; }
  .grid-wrap { flex:1; overflow:auto; padding:12px 16px; }
  .stats { display:flex; gap:22px; padding:10px 16px; border-bottom:1px solid var(--bd);
           background:#121214; flex:none; }
  .stat { display:flex; flex-direction:column; gap:2px; }
  .stat .k { font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--dim2); text-transform:uppercase; }
  .stat .v { font-family:var(--mono); font-size:15px; color:var(--fg); }
  .stat .v.hl { color:var(--amber); }

  table { border-collapse:separate; border-spacing:2px; }
  th { font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--dim2);
       text-transform:uppercase; font-weight:400; text-align:center; padding-bottom:4px; }
  th.scene-h { text-align:left; padding-left:2px; }
  td.scene { font-family:var(--mono); font-size:10px; color:var(--dim); white-space:nowrap;
             padding-right:8px; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
  td.cell { width:72px; height:20px; border-radius:2px; background:#18181b; cursor:pointer;
            font-family:var(--mono); font-size:8.5px; padding:0 5px; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; color:transparent; border:1px solid transparent; }
  td.cell.has { color:#141417; }
  td.cell.sel { border-color:var(--amber); box-shadow:0 0 0 1px rgba(240,178,60,.5); }

  aside { width:260px; flex:none; border-left:1px solid var(--bd); background:var(--rail);
          display:flex; flex-direction:column; padding:14px; gap:12px; overflow:auto; }
  .lbl { font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--dim2); text-transform:uppercase; }
  .swatches { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
  .sw { height:22px; border-radius:3px; border:1px solid rgba(255,255,255,.07); cursor:pointer; }
  .sw.on { border:2px solid var(--amber); }
  input[type=text] { background:#151517; border:1px solid var(--bd3); border-radius:4px;
                     padding:7px 9px; color:var(--fg); font-family:var(--mono); font-size:12px; width:100%; }
  .log { font-family:var(--mono); font-size:10px; line-height:1.6; color:var(--dim);
         white-space:pre-wrap; word-break:break-word; border-top:1px solid var(--bd); padding-top:10px; }
  .log b { color:var(--green); font-weight:400; }
  .log i { color:var(--red); font-style:normal; }
  .empty { padding:60px 20px; text-align:center; color:var(--dim); font-size:13px; line-height:1.7; }
</style>
</head>
<body>
<header>
  <div class="title">Session Bridge</div>
  <div class="pill" id="ws">connecting</div>
  <div class="pill" id="lom">lom ?</div>
  <div class="spacer"></div>
  <button id="snap" class="primary">Snapshot</button>
</header>

<div class="stats">
  <div class="stat"><div class="k">Tracks</div><div class="v" id="s-tracks">—</div></div>
  <div class="stat"><div class="k">Scenes</div><div class="v" id="s-scenes">—</div></div>
  <div class="stat"><div class="k">Clips</div><div class="v" id="s-clips">—</div></div>
  <div class="stat"><div class="k">LOM walk</div><div class="v hl" id="s-ms">—</div></div>
  <div class="stat"><div class="k">Selected</div><div class="v" id="s-sel">0</div></div>
</div>

<main>
  <div class="grid-wrap" id="grid">
    <div class="empty">Load the device in Live, then hit <b>Snapshot</b>.</div>
  </div>
  <aside>
    <div class="lbl">Rename selected</div>
    <input type="text" id="pattern" placeholder="{track} {scene}" value="">
    <div style="font-size:10px;color:var(--dim2);line-height:1.5;">
      Tokens: {track} {scene} {name} {n}
    </div>
    <div class="lbl">Color selected <span id="pal-n" style="color:var(--dim2)"></span></div>
    <div class="swatches" id="sw"></div>
    <button id="extract">Extract palette from Live</button>
    <button class="primary" id="apply" disabled>Apply to 0</button>
    <button id="clear">Clear selection</button>
    <div class="log" id="log">ready.</div>
  </aside>
</main>

<script>
const hex = c => '#' + (c & 0xFFFFFF).toString(16).padStart(6,'0');

// Live's palette, derived from Live itself and cached server-side.
let PALETTE = [];
let snap = null, chosenIndex = null, msgId = 1;
const selected = new Map(); // "t:s" -> {t,s}
const $ = id => document.getElementById(id);

function log(html, cls) {
  const el = $('log');
  el.innerHTML = (cls ? `<${cls}>${html}</${cls}>` : html) + '\n' + el.innerHTML;
}

// --- socket -----------------------------------------------------------
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { $('ws').textContent = 'connected'; $('ws').className = 'pill on'; };
  ws.onclose = () => {
    $('ws').textContent = 'disconnected'; $('ws').className = 'pill off';
    setTimeout(connect, 1000);
  };
  ws.onmessage = e => onMessage(JSON.parse(e.data));
}
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify({ id: msgId++, ...o }));

function onMessage(m) {
  switch (m.type) {
    case 'status':
      $('lom').textContent = m.lomReady ? 'lom ready' : 'lom waiting';
      $('lom').className = 'pill ' + (m.lomReady ? 'on' : 'off');
      break;
    case 'snapshot':
      snap = m.data; render();
      log(`snapshot — ${m.data.clipCount} clips in ${m.lomMs}ms`, 'b');
      break;
    case 'progress':
      $('apply').textContent = `${m.done} / ${m.total}`;
      break;
    case 'applied':
      log(`applied ${m.applied}, skipped ${m.skipped} in ${m.lomMs}ms`, 'b');
      send({ type: 'snapshot' });
      break;
    case 'palette':
      PALETTE = m.colors || []; renderSwatches();
      log(`palette — ${m.count} colors extracted from Live`, 'b');
      break;
    case 'changed':
      log(`live set changed (${m.kind})`);
      break;
    case 'reload':
      location.reload();
      break;
    case 'error':
      log(m.message, 'i');
      break;
  }
}

// --- render -----------------------------------------------------------
function render() {
  $('s-tracks').textContent = snap.trackCount;
  $('s-scenes').textContent = snap.sceneCount;
  $('s-clips').textContent = snap.clipCount;
  $('s-ms').textContent = snap.ms + 'ms';

  const byKey = new Map(snap.clips.map(c => [c.t + ':' + c.s, c]));
  const cols = snap.tracks.filter(t => !t.isGroup);

  const head = `<tr><th class="scene-h">Scene</th>${
    cols.map(t => `<th>${esc(t.name)}</th>`).join('')}</tr>`;

  const rows = snap.scenes.map(sc => {
    const cells = cols.map(t => {
      const c = byKey.get(t.i + ':' + sc.i);
      const k = t.i + ':' + sc.i;
      const on = selected.has(k) ? ' sel' : '';
      return c
        ? `<td class="cell has${on}" data-k="${k}" style="background:${hex(c.color)}" title="${esc(c.name)}">${esc(c.name)}</td>`
        : `<td class="cell${on}" data-k="${k}"></td>`;
    }).join('');
    return `<tr><td class="scene">${sc.i + 1}. ${esc(sc.name) || '<span style="color:#3a3a41">—</span>'}</td>${cells}</tr>`;
  }).join('');

  $('grid').innerHTML = `<table>${head}${rows}</table>`;
  $('grid').querySelectorAll('td.cell').forEach(td => {
    td.onclick = () => toggle(td.dataset.k, td);
  });
  updateSel();
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toggle(k, td) {
  if (selected.has(k)) { selected.delete(k); td.classList.remove('sel'); }
  else { const [t,s] = k.split(':').map(Number); selected.set(k,{t,s}); td.classList.add('sel'); }
  updateSel();
}

function updateSel() {
  const n = selected.size;
  $('s-sel').textContent = n;
  $('apply').textContent = `Apply to ${n}`;
  $('apply').disabled = n === 0;
}

// --- swatches ---------------------------------------------------------
function renderSwatches() {
  $('pal-n').textContent = PALETTE.length ? `(${PALETTE.length})` : '';
  if (!PALETTE.length) {
    $('sw').innerHTML = `<div style="grid-column:1/-1;font-size:10px;color:var(--dim2);line-height:1.5">
      No palette cached yet — extract it once.</div>`;
    return;
  }
  $('sw').innerHTML = PALETTE.map((c, i) =>
    `<div class="sw${chosenIndex === i ? ' on' : ''}" data-i="${i}"
          title="index ${i} — ${hex(c)}" style="background:${hex(c)}"></div>`).join('');
  $('sw').querySelectorAll('.sw').forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.i);
      chosenIndex = chosenIndex === i ? null : i;
      renderSwatches();
    };
  });
}

async function loadPalette() {
  try {
    const p = await (await fetch('/palette.json')).json();
    PALETTE = p.colors || [];
  } catch { PALETTE = []; }
  renderSwatches();
}

// --- actions ----------------------------------------------------------
$('snap').onclick = () => send({ type: 'snapshot' });
$('clear').onclick = () => { selected.clear(); render(); };
$('extract').onclick = () => {
  log('extracting palette — adds and removes one scratch scene…');
  send({ type: 'palette' });
};

$('apply').onclick = () => {
  const pattern = $('pattern').value.trim();
  const byKey = new Map(snap.clips.map(c => [c.t + ':' + c.s, c]));
  const trackName = Object.fromEntries(snap.tracks.map(t => [t.i, t.name]));
  const sceneName = Object.fromEntries(snap.scenes.map(s => [s.i, s.name]));

  const ops = [...selected.values()].map(({ t, s }, i) => {
    const op = { t, s };
    if (chosenIndex !== null) op.colorIndex = chosenIndex;
    if (pattern) {
      op.name = pattern
        .replace(/\{track\}/g, trackName[t] ?? '')
        .replace(/\{scene\}/g, sceneName[s] ?? '')
        .replace(/\{name\}/g, byKey.get(t + ':' + s)?.name ?? '')
        .replace(/\{n\}/g, String(i + 1));
    }
    return op;
  }).filter(op => op.colorIndex !== undefined || op.name !== undefined);

  if (!ops.length) return log('pick a color or type a rename pattern', 'i');
  log(`applying ${ops.length} ops…`);
  send({ type: 'apply', ops });
};

loadPalette();
connect();
</script>
</body>
</html>
